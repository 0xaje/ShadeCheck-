name: ShadeCheck SC-002
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Verify deliberately weak flow fails strict policy
        shell: bash
        run: |
          set +e
          shadecheck test --fixture fixtures/transaction-v5.hex --policy strict
          result=$?
          set -e
          test "$result" -eq 1
          shadecheck report --format html --output out/report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadecheck-protocol-evidence
          path: out/
