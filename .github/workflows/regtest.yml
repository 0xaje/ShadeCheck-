name: Real Zcash MVP acceptance
on:
  push:
    paths:
      - 'integration/**'
      - 'scripts/regtest.py'
      - 'scripts/broadcast_comparison.py'
      - 'scripts/selective_fetch.py'
      - 'scripts/sync_pattern.py'
      - 'scripts/transparent_fallback.py'
      - 'scripts/privacy_regression.py'
      - 'scripts/acceptance.py'
      - 'shadecheck/**'
      - '.github/workflows/regtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Run consolidated real MVP acceptance
        run: python scripts/acceptance.py
      - name: Capture backend logs
        if: always()
        run: |
          mkdir -p out
          docker compose -f integration/compose.yml logs --no-color > out/backend.log 2>&1
          cat out/backend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-regtest-evidence
          path: out/
      - name: Stop local backend
        if: always()
        run: docker compose -f integration/compose.yml down
