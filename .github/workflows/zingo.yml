name: Independent Zingo regtest integration
on:
  push:
    branches: [integration/zingo-regtest]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zingo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Install upstream build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Checkout pinned independent upstream
        run: |
          git clone --no-checkout https://github.com/zingolabs/zingolib.git "$RUNNER_TEMP/zingolib"
          git -C "$RUNNER_TEMP/zingolib" checkout --detach 31da83657d88fbb3b57bf45996023850e8aaf9da
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.zcash-params
            ${{ runner.temp }}/zingolib/target
          key: zingo-regtest-${{ runner.os }}-31da83657d88fbb3b57bf45996023850e8aaf9da-rust190-v1
      - name: Build unmodified pinned Zingo CLI
        working-directory: ${{ runner.temp }}/zingolib
        run: cargo build --locked --release -p zingo-cli --features regtest
      - name: Check observer and integration boundaries
        run: python -m unittest discover -s tests -v
      - name: Real direct and observed wallet synchronization
        run: python scripts/zingo_integration.py --source "$RUNNER_TEMP/zingolib"
      - name: Capture isolated backend diagnostics
        if: always()
        run: |
          mkdir -p out/zingo-diagnostics
          docker compose -f integration/zingo/compose.yml logs --no-color > out/zingo-diagnostics/backend.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-zingo-evidence
          path: out/
      - name: Stop isolated backend
        if: always()
        run: docker compose -f integration/zingo/compose.yml down
