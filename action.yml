name: 'ShadeCheck Privacy CI'
description: 'Automated privacy regression and behavioral testing for Zcash applications'
author: '0xaje / ShadeCheck'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  policy:
    description: 'Enforcement policy: strict (fails on any finding/warning) or advisory'
    required: false
    default: 'strict'
  rules:
    description: 'Space-separated list of rule families to evaluate (SC-001, SC-002, SC-003, SC-004, SC-005)'
    required: false
    default: 'SC-002'
  fixture:
    description: 'Path to hex-encoded raw transaction fixture (replayed against rejecting local probe)'
    required: false
    default: 'fixtures/transaction-v5.hex'
  events:
    description: 'Path to captured gRPC events JSONL file (mutually exclusive with fixture)'
    required: false
    default: ''
  config:
    description: 'Path to policy JSON config file (required for SC-001 and SC-004)'
    required: false
    default: ''
  baseline:
    description: 'Path to saved baseline JSON for regression checking (SC-005)'
    required: false
    default: ''
  output-dir:
    description: 'Directory to write evidence, reports, and HTML artifacts'
    required: false
    default: 'out'
  generate-summary:
    description: 'Render rich Markdown report into GitHub Actions Step Summary'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Privacy CI result status: PASS, WARN, or FAIL'
    value: ${{ steps.run-shadecheck.outputs.status }}
  findings-count:
    description: 'Number of observed privacy findings'
    value: ${{ steps.run-shadecheck.outputs.findings_count }}
  report-path:
    description: 'Path to generated JSON report'
    value: ${{ steps.run-shadecheck.outputs.report_path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '>=3.11'

    - name: Install ShadeCheck
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet "${{ github.action_path }}"

    - name: Run ShadeCheck Privacy CI
      id: run-shadecheck
      shell: bash
      run: |
        mkdir -p "${{ inputs.output-dir }}"
        REPORT_FILE="${{ inputs.output-dir }}/report.json"
        HTML_FILE="${{ inputs.output-dir }}/report.html"
        EVENTS_FILE="${{ inputs.output-dir }}/events.jsonl"

        CMD_ARGS=("test" "--policy" "${{ inputs.policy }}" "--output" "$REPORT_FILE" "--record" "$EVENTS_FILE")

        if [ -n "${{ inputs.events }}" ]; then
          CMD_ARGS+=("--events" "${{ inputs.events }}")
        elif [ -n "${{ inputs.fixture }}" ]; then
          # If relative to caller workspace, check if exists, else look in action path
          FIXTURE_PATH="${{ inputs.fixture }}"
          if [ ! -f "$FIXTURE_PATH" ] && [ -f "${{ github.action_path }}/fixtures/transaction-v5.hex" ]; then
            FIXTURE_PATH="${{ github.action_path }}/fixtures/transaction-v5.hex"
          fi
          CMD_ARGS+=("--fixture" "$FIXTURE_PATH")
        else
          echo "::error::Either 'events' or 'fixture' must be specified."
          exit 2
        fi

        if [ -n "${{ inputs.config }}" ]; then
          CMD_ARGS+=("--config" "${{ inputs.config }}")
        fi

        if [ -n "${{ inputs.baseline }}" ]; then
          CMD_ARGS+=("--baseline" "${{ inputs.baseline }}")
        fi

        read -ra RULES_ARRAY <<< "${{ inputs.rules }}"
        CMD_ARGS+=("--rules" "${RULES_ARRAY[@]}")

        set +e
        shadecheck "${CMD_ARGS[@]}"
        CI_EXIT_CODE=$?
        set -e

        # Generate HTML report
        if [ -f "$REPORT_FILE" ]; then
          shadecheck report --input "$REPORT_FILE" --format html --output "$HTML_FILE"

          # Extract status and findings count for outputs
          STATUS=$(python -c "import json; r=json.load(open('$REPORT_FILE')); print(r.get('status','UNKNOWN'))")
          FINDINGS=$(python -c "import json; r=json.load(open('$REPORT_FILE')); print(len(r.get('findings',[])))")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "findings_count=$FINDINGS" >> "$GITHUB_OUTPUT"
          echo "report_path=$REPORT_FILE" >> "$GITHUB_OUTPUT"

          # Generate GitHub Step Summary if requested
          if [ "${{ inputs.generate-summary }}" = "true" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
            shadecheck report --input "$REPORT_FILE" --format markdown >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

        if [ "$CI_EXIT_CODE" -ne 0 ]; then
          echo "::error::ShadeCheck Privacy CI detected policy violations (exit $CI_EXIT_CODE)."
          exit "$CI_EXIT_CODE"
        fi
