name: shadecheck-modern-regtest
services:
  zebra:
    image: zfnd/zebra:7.0.0@sha256:a70d2be8ffef3a4b6e37355724e36a0e6c1838e46baa28bfb216739f00cf2d34
    platform: linux/amd64
    environment:
      ZEBRA_NETWORK__NETWORK: Regtest
      ZEBRA_RPC__LISTEN_ADDR: 0.0.0.0:18232
      ZEBRA_RPC__ENABLE_COOKIE_AUTH: "false"
      ZEBRA_MINING__MINER_ADDRESS: ${SHADECHECK_MODERN_MINER:?driver must supply a fresh local miner address}
    volumes:
      - ./zebra.toml:/home/zebra/.config/zebrad.toml:ro
      - zebra-data:/home/zebra/.cache/zebra
    networks: [regtest]
  zaino:
    image: zingodevops/zainod:0.10.1-no-tls@sha256:c8428a39d510fd59a9182a5e19cf473d6af6a4b6a672aff8b1a690e9c23c17b9
    platform: linux/amd64
    environment:
      ZAINO_BACKEND: fetch
      ZAINO_NETWORK: Regtest
      ZAINO_VALIDATOR_SETTINGS__VALIDATOR_JSONRPC_LISTEN_ADDRESS: zebra:18232
      ZAINO_GRPC_SETTINGS__LISTEN_ADDRESS: 0.0.0.0:8137
      ZAINO_STORAGE__DATABASE__PATH: /app/data
      ZAINO_STORAGE__DATABASE__SYNC_WRITE_BATCH_SIZE: "1"
      ZAINO_STORAGE__DATABASE__ACCUMULATOR_REBUILD_MEMORY_SIZE: "1"
    depends_on: [zebra]
    volumes:
      - ./zaino.toml:/app/config/zainod.toml:ro
      - zaino-data:/app/data
    ports:
      - "127.0.0.1:29067:8137"
    networks: [regtest, observer]
volumes:
  zebra-data:
  zaino-data:
networks:
  regtest:
    internal: true
  observer: {}
