[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shadecheck"
version = "0.1.0"
description = "Evidence-based privacy tests for Zcash application RPC behavior"
requires-python = ">=3.11"
dependencies = ["grpcio==1.84.0", "protobuf==7.36.2"]

[project.scripts]
shadecheck = "shadecheck.cli:main"

[tool.setuptools.packages.find]
include = ["shadecheck*"]

[tool.setuptools.package-data]
shadecheck = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]
